# Combine with compose.restore.yaml only. Never use with the production stack.
services:
  application:
    profiles: [application]
    image: ${QANDA_STAGING_IMAGE:?Set the locally loaded immutable candidate tag}
    platform: linux/amd64
    pull_policy: never
    ports:
      - '127.0.0.1:4008:5000'
    networks: [isolated]
    environment:
      MAIN_URL: http://127.0.0.1:4008
      FRONTEND_URL: http://127.0.0.1:4008
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4008/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgresql://staging@application-db:5432/application_stage
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      NOT_SECURED: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: 'false'
    # Generate a disposable staging-only signing key without printing it.
    command: [bash, -c, 'export JWT_SECRET=$$(openssl rand -hex 32); exec bash /app/scripts/deployment/start-release.sh']
    volumes:
      - stage-uploads:/uploads
      - stage-config:/config
volumes:
  stage-uploads:
  stage-config:
